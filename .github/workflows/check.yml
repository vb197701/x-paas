name: Check Xray-core updates

# Weekly check for a new Xray-core release. If there is one, bump the
# pinned version (xray.version + Dockerfile SHA-256 + README) and push.
# That push triggers docker.yml, which builds and pushes the image with
# a tag containing the new Xray version. If there is no update, this
# workflow does nothing and pushes nothing.
#
# Schedule is in UTC: Mondays 03:00 UTC = Mondays 11:00 CST.
# GitHub may delay scheduled runs; use workflow_dispatch to test now.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Get latest Xray-core release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # /releases/latest returns the latest stable release, not a pre-release.
          LATEST_JSON=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/XTLS/Xray-core/releases/latest)
          TAG=$(printf '%s' "$LATEST_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          PUBLISHED=$(printf '%s' "$LATEST_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['published_at'][:10])")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "Latest Xray-core: $TAG ($PUBLISHED), current: $(cat xray.version)"

      - name: Compare and update if needed
        id: update
        run: |
          CURRENT=$(tr -d '[:space:]' < xray.version)
          LATEST="${{ steps.latest.outputs.tag }}"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Up to date: $CURRENT, nothing to do."
            exit 0
          fi
          echo "Updating $CURRENT -> $LATEST"
          curl -fsSL -o /tmp/amd64.dgst "https://github.com/XTLS/Xray-core/releases/download/${LATEST}/Xray-linux-64.zip.dgst"
          curl -fsSL -o /tmp/arm64.dgst "https://github.com/XTLS/Xray-core/releases/download/${LATEST}/Xray-linux-arm64-v8a.zip.dgst"
          AMD64_SHA=$(grep '^SHA2-256=' /tmp/amd64.dgst | cut -d= -f2 | tr -d ' ')
          ARM64_SHA=$(grep '^SHA2-256=' /tmp/arm64.dgst | cut -d= -f2 | tr -d ' ')
          if [ -z "$AMD64_SHA" ] || [ -z "$ARM64_SHA" ]; then
            echo "error: failed to parse SHA-256 from .dgst files" >&2
            exit 1
          fi
          python3 .github/scripts/update-xray.py \
            --version "$LATEST" \
            --published "${{ steps.latest.outputs.published }}" \
            --amd64-sha "$AMD64_SHA" \
            --arm64-sha "$ARM64_SHA"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xray.version Dockerfile README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: bump Xray-core to ${{ steps.update.outputs.version }}"
          git push
          echo "Pushed version bump; docker.yml will now build the new image."
