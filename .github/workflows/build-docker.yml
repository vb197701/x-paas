name: Build and push images

# Builds on every push to main and on version tags, plus manual runs.
# Old workflow only ran on manual dispatch, with 2022-era actions.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # GHCR is always available with GITHUB_TOKEN. Docker Hub keeps your
  # existing PaaS image address working: docker.io/<user>/v2-koyeb.
  # It needs DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repo Secrets,
  # the same secrets the old workflow used (token, not password).
  # Xray version is not hardcoded here: it is read from xray.version
  # (single source of truth, updated weekly by check-xray.yml).
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read Xray version
        id: xray
        run: |
          VERSION=$(tr -d '[:space:]' < xray.version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Xray-core: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ secrets.DOCKERHUB_USERNAME }}/x-paas
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=xray-${{ steps.xray.outputs.version }}
            type=raw,value=${{ steps.xray.outputs.version }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            XRAY_VERSION=${{ steps.xray.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
